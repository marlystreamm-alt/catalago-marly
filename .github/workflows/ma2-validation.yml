name: MA2 validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [ma2-pro-stock-preview]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/*.test.mjs
